<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Horária</title>
    <link rel="icon" href="/src/main/webapp/img/logo.svg">
    <link rel="stylesheet" href="/src/main/webapp/css/professor.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-circle">
                    <img class="logo-img" src="/src/main/webapp/img/logo.svg" alt="">
                </div>
                <span class="brand-name">Insituto<span>RME</span></span>
            </div>

            <nav class="nav-menu">
                <a href="/src/main/webapp/professor/professor.html" class="nav-link">
                    <span class="icon"><img src="/src/main/webapp/img/inicio.png" alt=""></span> <span>Painel Geral</span>
                </a>
                <a href="/src/main/webapp/professor/meus-alunos.html" class="nav-link">
                    <span class="icon"><img src="/src/main/webapp/img/alunos.png" alt=""></span> <span>Meus alunos</span>
                </a>
                <a href="/src/main/webapp/professor/notas.html" class="nav-link">
                    <span class="icon"><img src="/src/main/webapp/img/nota.png" alt=""></span> <span>Lançar Notas</span>
                </a>
                <a href="/src/main/webapp/professor/grade-horaria.html" class="nav-link">
                    <span class="icon"><img src="/src/main/webapp/img/grade-horaria.png" alt=""></span> <span>Grade horária</span>
                </a>
                <a href="/src/main/webapp/professor/observacoes.html" class="nav-link active">
                    <span class="icon"><img src="/src/main/webapp/img/observacao.png" alt=""></span> <span>Observações</span>
                </a>
            </nav>

            <div class="sidebar-user">
                <div class="avatar">L</div>
                <div class="user-meta">
                    <span class="u-name">Prof. Lisete</span>
                    <span class="u-status">Matemática</span>
                </div>
            </div>
        </aside>

        <main class="content-area">

        <div class="topo">
            <h2>Grade horária</h2>

            <div class="filtros">
                <button class="btn-dia">Segunda-feira ▾</button>
            </div>
        </div>

        <div class="lista">

            <div class="card">
                <div class="info">
                    <p>Geografia</p>
                    <p class="turma">2°H</>
                </div>
                <p>7:00 às 7:50</p>
            </div>

            <div class="card">
                <div class="info">
                    <p>Geografia</p>
                    <p class="turma verde">1°G</>
                </div>
                <p>7:50 às 8:40</p>
            </div>

            <div class="card">
                <div class="info">
                    <p>História</p>
                    <p class="turma">2°F</>
                </div>
                <p>8:40 às 9:30</p>
            </div>

            <div class="card">
                <div class="info">
                    <p>Sociologia</p>
                    <p class="turma verde">1°H</p>
                </div>
                <p>9:30 às 10:20</p>
            </div>

        </div>
    </main>
</body>
</html>
