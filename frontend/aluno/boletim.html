<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logo.svg">
    <link rel="stylesheet" href="../css/aluno.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Boletim | Instituto RME</title>
</head>

<body>
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-circle">R</div>
                <span class="brand-name">Instituto<span>RME</span></span>
            </div>
            <nav class="nav-menu">
                <a href="home.html" class="nav-link">
                    <i data-feather="home"></i>
                    <span>Início</span>
                </a>

                <a href="disciplinas.html" class="nav-link">
                    <i data-feather="book"></i>
                    <span>Disciplinas</span>
                </a>

                <a href="boletim.html" class="nav-link active">
                    <i data-feather="bar-chart-2"></i>
                    <span>Boletim</span>
                </a>

                <a href="observacoes.html" class="nav-link">
                    <i data-feather="message-square"></i>
                    <span>Observações</span>
                </a>

                <a href="grade.html" class="nav-link">
                    <i data-feather="calendar"></i>
                    <span>Grade horária</span>
                </a>
            </nav>
            <div class="sidebar-user">
                <div class="avatar" id="avatarSidebar">?</div>
                <div class="user-meta">
                    <span class="u-name" id="nomeSidebar">Carregando...</span>
                    <span class="u-status">Online</span>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main>
            <div class="page-header">
                <h2 class="titulo">Boletim</h2>
                <div id="resumoBoletim" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
            </div>

            <div class="tabela-container">
                <div class="tabela-scroll">
                    <table id="tabelaBoletim">
                        <thead>
                            <tr>
                                <th>Disciplina</th>
                                <th>Professor</th>
                                <th>N1</th>
                                <th>N2</th>
                                <th>Média</th>
                                <th>Situação</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyBoletim">
                            <tr>
                                <td colspan="6" class="loading">Carregando boletim...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/aluno.js"></script>
    <script>
        (async () => {
            const dados = await initPagina();
            if (!dados) return;

            const tbody = document.getElementById('tbodyBoletim');
            const resumo = document.getElementById('resumoBoletim');

            if (!dados.notas.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">Nenhuma nota registrada.</td></tr>';
                return;
            }

            // Estatísticas rápidas
            const medias = dados.notas.map(n => n.media).filter(m => m !== null);
            const mediaGeral = medias.length
                ? (medias.reduce((a, b) => a + b, 0) / medias.length).toFixed(1) : '—';
            const aprovadas = medias.filter(m => m >= 7).length;
            const recuperacao = medias.filter(m => m >= 5 && m < 7).length;
            const reprovadas = medias.filter(m => m < 5).length;

            resumo.innerHTML = `
        <div class="badge-info">Média geral: <span>${mediaGeral}</span></div>
        <div class="badge-info" style="border-color:#bbf7d0">Aprovadas: <span style="color:#16a34a">${aprovadas}</span></div>
        ${recuperacao ? `<div class="badge-info" style="border-color:#fef08a">Recuperação: <span style="color:#ca8a04">${recuperacao}</span></div>` : ''}
        ${reprovadas ? `<div class="badge-info" style="border-color:#fecaca">Reprovadas: <span style="color:#dc2626">${reprovadas}</span></div>` : ''}
    `;

            // Linhas da tabela
            tbody.innerHTML = dados.notas.map(n => {
                const media = n.media !== null ? parseFloat(n.media) : null;
                let situacao = '—';
                let sitClass = '';
                if (media !== null) {
                    if (media >= 7) { situacao = 'Aprovado'; sitClass = 'media-chip green'; }
                    else if (media >= 5) { situacao = 'Recuperação'; sitClass = 'media-chip yellow'; }
                    else { situacao = 'Reprovado'; sitClass = 'media-chip red'; }
                }
                return `
            <tr>
                <td>
                    <div class="disciplina-nome">${n.materia}</div>
                </td>
                <td><div class="professor-nome">${n.professor}</div></td>
                <td>${n.nota1 !== null ? parseFloat(n.nota1).toFixed(1) : '—'}</td>
                <td>${n.nota2 !== null ? parseFloat(n.nota2).toFixed(1) : '—'}</td>
                <td>${mediaChip(n.media)}</td>
                <td><span class="${sitClass}">${situacao}</span></td>
            </tr>
        `;
            }).join('');
        })();
    </script>
    <script>
        feather.replace();
    </script>
</body>

</html>
