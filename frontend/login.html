<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto RME - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="banner-section">
            <div class="logo">
                <img src="images/logo.svg" alt="Instituto RME">
                <span>Instituto RME</span>
            </div>
            <h1>Bem-vindo de volta!</h1>
            <p class="subtitle">Acesse sua conta para continuar sua jornada de aprendizado.</p>
        </div>
        <div class="form-section">
            <div class="form-container">
                <h2>Login</h2>
                <p class="form-subtitle">Entre com suas credenciais</p>

                <div class="alert alert-error" id="erroLogin" style="display:none;"></div>

                <form onsubmit="fazerLogin(event)">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required autofocus
                            placeholder="seu@institutorme.com">
                    </div>
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-submit" id="btnLogin">Entrar</button>
                </form>

                <div style="margin-top: 20px; text-align: center;">
                    <a href="index.html" style="color: #2d8659; text-decoration: none;">Primeiro acesso? Criar conta</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>

</html>
