<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/professor.css">


    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-circle">
                    <img class="logo-img" src="../images/logo.svg" alt="Instituto RME">
                </div>
                <span class="brand-name">Instituto<span>RME</span></span>
            </div>

            <nav class="nav-menu">
                <a href="home.html" class="nav-link">
                    <i data-feather="home"></i>
                    <span>Painel Geral</span>
                </a>
                <a href="../professor/meus-alunos.html" class="nav-link">
                    <i data-feather="users"></i>
                    <span>Meus alunos</span>
                </a>
                <a href="../professor/notas.html" class="nav-link active">
                    <i data-feather="edit-3"></i>
                    <span>Lançar Notas</span>
                </a>
                <a href="../professor/grade-horaria.html" class="nav-link">
                    <i data-feather="calendar"></i>
                    <span>Grade horária</span>
                </a>
                <a href="../professor/observacoes.html" class="nav-link">
                    <i data-feather="message-square"></i>
                    <span>Observações</span>
                </a>
            </nav>

            <div class="sidebar-user">
                <div class="avatar" id="avatarSidebar">L</div>
                <div class="user-meta">
                    <span class="u-name" id="nomeSidebar">Prof. Lisete</span>
                    <span class="u-status">Matemática</span>
                </div>
            </div>
        </aside>

        <main class="content-area">

            <div class="page-header">
                <h2 class="titulo">Notas</h2>

                <div class="search-bar">
                    <button class="btn-primary" onclick="abrirModalNota()">+ Lançar nota</button>
                    <input type="text" placeholder="Buscar aluno ou turma...">
                </div>
            </div>

            <div class="tabela-container">
                <div class="tabela-scroll">
                    <table>
                        <thead>
                            <tr class="titulos-tabela">
                                <th>Matrícula</th>
                                <th>Nome</th>
                                <th>Matéria</th>
                                <th>N1</th>
                                <th>N2</th>
                                <th>Média</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td colspan="6" class="loading" style="text-align:center; padding: 2rem;">Carregando
                                    notas...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>


    <div id="modalLancarNota" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Lançar Nota</h3>
                <button class="modal-close" onclick="fecharModalNota()">&times;</button>
            </div>

            <form id="formLancarNota" onsubmit="iniciarSalvarNota(event)">
                <div class="form-field">
                    <label>Matéria</label>
                    <select id="selectMateria" required>
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>Sala/Turma</label>
                    <select id="selectSala" required onchange="aoMudarSala(this.value)">
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>Aluno</label>
                    <select id="selectAluno" required>
                        <option value="">Selecione a sala primeiro</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>Tipo de avaliação</label>
                    <div class="tipo-toggle">
                        <label class="tipo-option">
                            <input type="radio" name="tipoNota" id="tipoN1" value="n1" checked>
                            <span>N1</span>
                        </label>
                        <label class="tipo-option">
                            <input type="radio" name="tipoNota" id="tipoN2" value="n2">
                            <span>N2</span>
                        </label>
                    </div>
                </div>

                <div class="form-field">
                    <label>Nota (0–10)</label>
                    <input type="number" id="inputNota" required min="0" max="10" step="0.1" placeholder="Ex: 8.5">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="fecharModalNota()">Cancelar</button>
                    <button type="submit" id="btnSalvarNota" class="btn-primary">Lançar Nota</button>
                </div>
            </form>
        </div>
    </div>


    <div id="modalConfirmacao" class="modal-overlay">
        <div class="modal-content modal-confirm">
            <div class="confirm-icon" id="confirmIcon">⚠️</div>
            <h3 id="confirmTitulo">Confirmar ação</h3>
            <p id="confirmMensagem">Tem certeza?</p>
            <div class="form-actions">
                <button type="button" class="btn-secondary" id="btnConfirmCancelar">Cancelar</button>
                <button type="button" class="btn-primary" id="btnConfirmOk">Confirmar</button>
            </div>
        </div>
    </div>


    <div id="toastContainer" class="toast-container"></div>

    <script src="../js/professor.js"></script>
    <script>
        renderNotas();
        feather.replace();
    </script>
</body>

</html>
